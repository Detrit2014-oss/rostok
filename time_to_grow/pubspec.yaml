publish_to: 'none'
version: 2.2.0+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  geolocator: ^12.0.0
  # ── Firebase для челленджей с друзьями (план v2.0) ──────────────────
  # Пошаговая инструкция и готовый код бэкенда: docs/FIREBASE.md
  # Раскомментируйте после настройки проекта Firebase:
  # firebase_core: ^3.6.0
  # cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Реалистичные спрайты питомцев (v2.1.0): 30 видов + позы сна.
